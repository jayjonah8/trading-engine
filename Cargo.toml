[package]
name = "trading-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
hyperliquid_rust_sdk = "0.6.0"
ethers = { version = "2.0.14", features = ["eip712", "abigen"] }
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json"] }
serenity = { version = "0.11", features = ["client", "gateway", "http"] }
slack-morphism = { version = "2", features = ["hyper"] }
ibapi = "4.0"
futures = "0.3"
