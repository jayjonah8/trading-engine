      }

      .support {
        color: #22c55e;

        row.innerHTML = `
          <td class="${typeClass}">${level.type}</td>
          <td>${level.price.toFixed(4)}</td>
          <td>${level.lower.toFixed(4)} - ${level.upper.toFixed(4)}</td>
          <td>${level.strength.toFixed(2)}</td>
          <td>${level.touches}</td>
          <td>${level.reversal.toFixed(3)}%</td>
          <td>${level.volume.toFixed(2)}</td>
        `;

        // ====================================================
        // HOVER HIGHLIGHT
        // ====================================================

        row.addEventListener("mouseenter", () => {
          hoveredLevelIndex = index;
          updateLevelHighlight();
        });

        row.addEventListener("mouseleave", () => {
          hoveredLevelIndex = null;
          updateLevelHighlight();
        });

        // ====================================================
        // CLICK SELECTION
        // ====================================================

        row.addEventListener("click", () => {
          if (selectedLevelIndex === index) {
            selectedLevelIndex = null;
          } else {
            selectedLevelIndex = index;
          }

          document.querySelectorAll("#levels-body tr").forEach((r) => r.classList.remove("selected"));

          if (selectedLevelIndex !== null) {
            row.classList.add("selected");
          }

          updateLevelHighlight();
        });

        tbody.appendChild(row);
      });

      // ====================================================
      // RESPONSIVE RESIZING
      // ====================================================

      const resizeObserver = new ResizeObserver((entries) => {
        const entry = entries[0];

        chart.applyOptions({
          width: entry.contentRect.width,
        });
      });

      resizeObserver.observe(chartContainer);
    </script>
  </body>
</html>
